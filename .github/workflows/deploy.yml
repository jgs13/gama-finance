name: Deploy GAMA FINANCE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["GAMA FINANCE - Publicar APK automaticamente"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate GAMA FINANCE
        run: |
          node --check app.js
          node --check firebase-client.js
          node --check sw.js
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const required of ['app.js', 'styles.css', 'firebase-client.js']) {
            if (!html.includes(required)) throw new Error('Missing app reference: ' + required);
          }
          const ids = [...html.matchAll(/\\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.name !== 'GAMA FINANCE' || !manifest.start_url || !Array.isArray(manifest.icons)) throw new Error('Invalid PWA manifest');
          for (const file of ['app.js', 'styles.css', 'firebase-client.js', 'firebase-config.js', 'sw.js', 'icon.svg']) {
            if (!fs.existsSync(file)) throw new Error('Missing app file: ' + file);
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
