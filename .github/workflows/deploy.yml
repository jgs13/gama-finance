name: Deploy GAMA FINANCE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["GAMA FINANCE - Publicar APK automaticamente"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate application
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start);
          if (start < 0 || end < 0) throw new Error('Script block not found');
          const js = html.slice(start + 8, end);
          fs.writeFileSync('/tmp/gama-finance.js', js);
          const ids = html.split('id="').slice(1).map(part => part.split('"')[0]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + [...new Set(duplicates)].join(', '));
          const used = js.split("$('").slice(1).map(part => part.split("'")[0]).filter(selector => /^#[A-Za-z][\\w-]*$/.test(selector)).map(selector => selector.slice(1));
          const missing = [...new Set(used)].filter(id => !ids.includes(id));
          if (missing.length) throw new Error('Missing HTML elements: ' + missing.join(', '));
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (!manifest.name || !manifest.start_url || !Array.isArray(manifest.icons)) throw new Error('Invalid PWA manifest');
          for (const file of ['sw.js', 'icon.svg']) if (!fs.existsSync(file)) throw new Error('Missing PWA file: ' + file);
          NODE
          node --check /tmp/gama-finance.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
