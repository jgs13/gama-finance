name: Release GAMA FINANCE Android APK
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão semântica, por exemplo 1.0.1"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: gama-finance-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing GitHub Actions secret: $name"; exit 1; fi
          done
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android web assets
        run: npm run android:prepare
      - name: Add Android platform
        run: npx cap add android
      - name: Configure Gradle download
        run: |
          sed -i 's/gradle-8\.14\.3-all\.zip/gradle-8.14.3-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure release signing and version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks
          node scripts/configure-release.mjs
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GAMA-FINANCE.apk
      - name: Publish permanent GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: GAMA FINANCE ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: GAMA-FINANCE.apk
      - name: Publish version metadata for in-app update checks
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'version.json';
            const { data: file } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
            const current = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            current.version = '${{ steps.version.outputs.value }}';
            current.versionCode = Number('${{ github.run_number }}');
            current.releaseDate = new Date().toISOString().slice(0, 10);
            current.downloadUrl = 'https://github.com/jgs13/gama-finance/releases/latest/download/GAMA-FINANCE.apk';
            current.notes = 'Nova versão do GAMA FINANCE. Consulte as notas desta versão no GitHub.';
            const content = Buffer.from(JSON.stringify(current, null, 2) + '\\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({ owner: context.repo.owner, repo: context.repo.repo, path, message: 'Update GAMA FINANCE version metadata', content, sha: file.sha, branch: 'main' });
