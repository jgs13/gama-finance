name: GAMA FINANCE - Publicar APK assinado
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão (ex.: v1.0.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Conferir credenciais de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$KSP" && test -n "$KA" && test -n "$KP" || { echo "::error::Configure os quatro secrets Android de assinatura."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run android:prepare
      - run: npx cap add android
      - name: Ajustar Gradle
        run: |
          sed -i 's/gradle-8\.14\.3-all\.zip/gradle-8.14.3-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
      - run: npx cap sync android
      - name: Configurar assinatura e versão
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
          VERSION="${VERSION_TAG#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path
          version=sys.argv[1]
          major,minor,patch=map(int,version.split("."))
          code=major*10000+minor*100+patch
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("GAMA_KEYSTORE_FILE"))
                      storePassword System.getenv("GAMA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("GAMA_KEY_ALIAS")
                      keyPassword System.getenv("GAMA_KEY_PASSWORD")
                  }
              }""", 1)
          start=s.find("buildTypes {")
          pos=s.find("release {", start)
          if start < 0 or pos < 0:
              raise SystemExit("Bloco buildTypes/release não encontrado")
          s=s[:pos]+s[pos:].replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          s=re.sub(r"versionCode\s+\d+", f"versionCode {code}", s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s, count=1)
          p.write_text(s)
          PY
      - name: Compilar APK de distribuição
        working-directory: android
        env:
          GAMA_KEYSTORE_FILE: ${{ runner.temp }}/gama-release.jks
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Preparar APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/GamaFinance.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GamaFinance-release
          path: release/GamaFinance.apk
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GamaFinance-release
          path: release
      - name: Definir versão
        id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_OUTPUT"
      - name: Publicar Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: GAMA FINANCE ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: release/GamaFinance.apk
      - name: Atualizar versão pública e aviso no aplicativo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          git checkout main
          printf '{\n  "version": "%s",\n  "versionCode": %s\n}\n' "$VERSION" "$VERSION_CODE" > app-version.json
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "name": "GAMA FINANCE %s",\n  "releaseNotes": "Consulte as notas deste lançamento no GitHub.",\n  "downloadUrl": "https://github.com/%s/releases/download/%s/GamaFinance.apk",\n  "downloadPage": "https://jgs13.github.io/gama-finance/download/"\n}\n' "$VERSION" "$VERSION_CODE" "$VERSION" "$GITHUB_REPOSITORY" "$TAG" > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json latest.json
          git commit -m "Publish GAMA FINANCE $VERSION metadata" || true
          git push origin main
