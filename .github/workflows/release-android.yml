name: GAMA FINANCE - Publicar APK automaticamente
'on':
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'firebase-client.js'
      - 'firebase-config.js'
      - 'native-back.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'scripts/**'
      - 'assets/**'
      - 'manifest.json'
      - 'sw.js'
      - 'icon.svg'
      - '.github/workflows/release-android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gama-finance-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gerar próxima versão automaticamente
        id: version
        run: |
          CURRENT=$(node -p "require('./latest.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$VERSION"
          CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          printf '{\n  "version": "%s",\n  "versionCode": %s\n}\n' "$VERSION" "$CODE" > app-version.json
          echo "Publicando automaticamente GAMA FINANCE $VERSION"
      - name: Conferir credenciais de assinatura
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$KSP" && test -n "$KA" && test -n "$KP" || { echo "::error::Configure os quatro secrets Android de assinatura."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run android:prepare
      - run: npx cap add android
      - name: Ajustar Gradle
        run: |
          sed -i 's/gradle-8\.14\.3-all\.zip/gradle-8.14.3-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties || echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
      - run: npx cap sync android
      - name: Aplicar ícones oficiais do GAMA FINANCE
        run: node scripts/configure-android-icons.mjs
      - name: Configurar assinatura e versão
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
          python3 - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path
          version=sys.argv[1]
          major,minor,patch=map(int,version.split("."))
          code=major*10000+minor*100+patch
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("GAMA_KEYSTORE_FILE"))
                      storePassword System.getenv("GAMA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("GAMA_KEY_ALIAS")
                      keyPassword System.getenv("GAMA_KEY_PASSWORD")
                  }
              }""", 1)
          start=s.find("buildTypes {")
          pos=s.find("release {", start)
          if start < 0 or pos < 0:
              raise SystemExit("Bloco buildTypes/release não encontrado")
          s=s[:pos]+s[pos:].replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          s=re.sub(r"versionCode\s+\d+", f"versionCode {code}", s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "{version}"', s, count=1)
          p.write_text(s)
          PY
      - name: Compilar APK de distribuição
        working-directory: android
        env:
          GAMA_KEYSTORE_FILE: ${{ runner.temp }}/gama-release.jks
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Validar ícones dentro do APK final
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          test -s "$APK"

          # O otimizador do Android pode renomear arquivos XML dentro de res/
          # (por exemplo, res/HO.xml). Por isso validamos IDs e arquivos finais,
          # não os nomes originais dos recursos no ZIP.
          "$AAPT" dump badging "$APK" > /tmp/gama-badging.txt
          ICON_PATH=$(sed -n "s/^application-icon-[0-9][0-9]*:'\\([^']*\\)'.*/\\1/p" /tmp/gama-badging.txt | head -n 1)
          test -n "$ICON_PATH" || { echo "::error::APK sem ícone principal declarado."; exit 1; }
          unzip -Z1 "$APK" | grep -Fxq "$ICON_PATH" || { echo "::error::Arquivo do ícone principal não encontrado no APK."; exit 1; }

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/gama-manifest.txt
          ICON_ID=$(sed -nE 's/.*android:icon\\([^)]*\\)=@([^ ]+).*/\\1/p' /tmp/gama-manifest.txt | head -n 1)
          ROUND_ICON_ID=$(sed -nE 's/.*android:roundIcon\\([^)]*\\)=@([^ ]+).*/\\1/p' /tmp/gama-manifest.txt | head -n 1)
          test -n "$ICON_ID" || { echo "::error::Manifesto sem referência válida para android:icon."; cat /tmp/gama-manifest.txt; exit 1; }
          test -n "$ROUND_ICON_ID" || { echo "::error::Manifesto sem referência válida para android:roundIcon."; cat /tmp/gama-manifest.txt; exit 1; }

          "$AAPT" dump resources "$APK" > /tmp/gama-resources.txt
          grep -Fq "$ICON_ID" /tmp/gama-resources.txt || { echo "::error::O recurso do ícone principal não foi resolvido no APK."; exit 1; }
          grep -Fq "$ROUND_ICON_ID" /tmp/gama-resources.txt || { echo "::error::O recurso do ícone redondo não foi resolvido no APK."; exit 1; }

          echo "APK validado: ícone principal e redondo declarados no Manifesto, IDs resolvidos e arquivo do ícone presente no pacote."
      - name: Preparar APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/GamaFinance.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GamaFinance-release
          path: release/GamaFinance.apk
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GamaFinance-release
          path: release
      - name: Publicar Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: GAMA FINANCE ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: release/GamaFinance.apk
      - name: Atualizar versão pública e aviso no aplicativo
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.code }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          git checkout main
          printf '{\n  "version": "%s",\n  "versionCode": %s\n}\n' "$VERSION" "$VERSION_CODE" > app-version.json
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "name": "GAMA FINANCE %s",\n  "releaseNotes": "Consulte as notas deste lançamento no GitHub.",\n  "downloadUrl": "https://github.com/%s/releases/download/%s/GamaFinance.apk",\n  "downloadPage": "https://jgs13.github.io/gama-finance/download/"\n}\n' "$VERSION" "$VERSION_CODE" "$VERSION" "$GITHUB_REPOSITORY" "$TAG" > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-version.json latest.json
          git commit -m "Publish GAMA FINANCE $VERSION metadata"
          git push origin main
