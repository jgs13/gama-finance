name: Validate document analysis feature
on:
  push:
    branches:
      - correcao-receitas-despesas-salario-flexivel
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check document-ai.js
          node --check cloudflare/documents-worker/src/index.js
          node --check scripts/prepare-android.mjs
      - name: Verify app wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          for (const id of ['documentAiChoose','documentAiCameraBtn','documentAiFile','documentAiCamera','documentAiStatus','documentAiResult','documentAiList']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing UI element: ' + id);
          }
          if (!html.includes('src="./document-ai.js"')) throw new Error('Document module is not loaded.');
          if (!fs.readFileSync('scripts/prepare-android.mjs','utf8').includes('"document-ai.js"')) throw new Error('Android bundle does not include document-ai.js.');
          console.log('Document analysis UI and Android packaging references verified.');
          NODE

      - name: Validate main app script and income workflow
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const [i, attrs, code] of scripts) {
            if (/\bsrc\s*=/.test(attrs) || /\btype\s*=\s*["']importmap["']/.test(attrs) || !code.trim()) continue;
            const path = `/tmp/gama-inline-${checked++}.js`;
            fs.writeFileSync(path, code);
            execFileSync('node', ['--check', path], { stdio: 'inherit' });
          }
          if (!checked) throw new Error('No inline application scripts were checked.');
          for (const required of ['function receiveIncomePayment(', 'function editIncomePayment(', "e.type==='expense'&&", 'data-income-receive=']) {
            if (!html.includes(required)) throw new Error('Missing income workflow element: ' + required);
          }
          console.log(`Validated ${checked} inline script(s) and the Renda-only income workflow.`);
          NODE
